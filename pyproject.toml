[project]
name = "quest"
version = "0.1.0"
description = "QUEST: fork of: QUEST: orbital topology generation (fork of OpenFogStack Celestial) with pyproject.toml"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.58",
    "sgp4>=2.23",
    "cerberus>=1.3.5",
]

[project.optional-dependencies]
animation = ["vtk>=9.3", "seaborn>=0.13"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "celestial"   # the import name; differs from the project name "quest"
module-root = ""            # the package sits at the repo root, not under src/
